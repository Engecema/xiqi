<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIQI OS — Admin</title>
<style>
body{font-family:sans-serif;background:#f4f4f5;color:#18181b;margin:0;padding:16px}
.box{max-width:420px;margin:28px auto;background:#fff;border:1px solid #d4d4d8;border-radius:8px;padding:20px}
h1{font-size:16px;margin:0 0 12px}
.nav{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid #e4e4e7;padding-bottom:8px}
.nav button{background:#e4e4e7;color:#18181b;border:0;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.nav button.on{background:#18181b;color:#fff}
label{display:block;font-size:12px;font-weight:600;margin-top:8px}
input{width:100%;box-sizing:border-box;padding:8px;margin:4px 0 8px;border:1px solid #a1a1aa;border-radius:4px}
.btn{width:100%;padding:9px;background:#18181b;color:#fff;border:0;border-radius:4px;cursor:pointer;font-weight:600;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:13px}
.del{background:#dc2626;color:#fff;border:0;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px}
.hide{display:none}
footer{text-align:center;margin-top:20px;font-size:12px;color:#52525b;font-weight:600}
</style>
</head>
<body>
<div class="box" id="authBox">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h1 style="margin:0">XIQI OS — Administração</h1>
    <a href="/" style="font-size:12px;color:#2563eb;text-decoration:none;font-weight:600">← Voltar</a>
  </div>
  <div class="nav">
    <button type="button" id="t1" class="on">Login</button>
    <button type="button" id="t2">Cadastrar Admin</button>
    <button type="button" id="t3">Esqueci a Senha</button>
  </div>
  <div id="v1">
    <label>E-mail</label><input id="lEmail" type="email">
    <label>Senha</label><input id="lPass" type="password">
    <button type="button" class="btn" id="btnLogin">Entrar</button>
    <div id="m1" style="color:#dc2626;font-size:12px;margin-top:6px"></div>
  </div>
  <div id="v2" class="hide">
    <label>Nome Completo</label><input id="rName" type="text">
    <label>E-mail</label><input id="rEmail" type="email">
    <label>Senha</label><input id="rPass" type="password">
    <label>Chave Mestra</label><input id="rKey" type="password">
    <button type="button" class="btn" id="btnReg">Cadastrar Administrador</button>
    <div id="m2" style="font-size:12px;margin-top:6px"></div>
  </div>
  <div id="v3" class="hide">
    <label>E-mail</label><input id="fEmail" type="email">
    <label>Chave Mestra</label><input id="fKey" type="password">
    <label>Nova Senha</label><input id="fPass" type="password">
    <button type="button" class="btn" id="btnReset">Redefinir Senha</button>
    <div id="m3" style="font-size:12px;margin-top:6px"></div>
  </div>
</div>
<div class="box hide" id="panelBox">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h1 style="margin:0">Usuários Cadastrados</h1>
    <button type="button" id="btnOut" style="background:#71717a;color:#fff;border:0;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px">Sair</button>
  </div>
  <div id="list"></div>
</div>
<footer>Corporação Engecema</footer>
<script>
let tk = "";
const $ = id => document.getElementById(id);
function tab(n) {
  Array.of(1, 2, 3).forEach(i => {
    $("t" + i).className = i === n ? "on" : "";
    $("v" + i).className = i === n ? "" : "hide";
  });
  $("m1").textContent = "";
  $("m2").textContent = "";
  $("m3").textContent = "";
}
$("t1").onclick = () => tab(1);
$("t2").onclick = () => tab(2);
$("t3").onclick = () => tab(3);
async function load() {
  try {
    const r = await fetch("/api/admin/users", { headers: { "x-admin-key": tk } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      tk = "";
      $("panelBox").className = "box hide";
      $("authBox").className = "box";
      $("m1").textContent = d.error || "Sessão administrativa expirada.";
      return;
    }
    const u = d.users || [];
    $("list").innerHTML = u.length ? "" : "<p style='color:#71717a;font-size:13px'>Nenhum usuário cadastrado.</p>";
    u.forEach(x => {
      const div = document.createElement("div");
      div.className = "row";
      const sp = document.createElement("span"); const b1 = document.createElement("b"); b1.textContent = x.name; const sm = document.createElement("small"); sm.textContent = x.identifier; sp.appendChild(b1); sp.appendChild(document.createElement("br")); sp.appendChild(sm); div.appendChild(sp);
      const b = document.createElement("button");
      b.className = "del"; b.textContent = "Excluir";
      b.onclick = async () => {
        try {
          await fetch("/api/admin/users/" + encodeURIComponent(x.id), { method: "DELETE", headers: { "x-admin-key": tk } });
          load();
        } catch (e) {}
      };
      div.appendChild(b); $("list").appendChild(div);
    });
  } catch (e) {
    $("list").innerHTML = "<p style='color:#dc2626;font-size:13px'>Erro de comunicação com o servidor.</p>";
  }
}
$("btnLogin").onclick = async () => {
  $("m1").textContent = "";
  try {
    const r = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("lEmail").value, password: $("lPass").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("m1").textContent = d.error || "Erro"; return; }
    tk = d.token; $("authBox").className = "box hide"; $("panelBox").className = "box"; load();
  } catch (e) {
    $("m1").textContent = "Erro de comunicação com o servidor.";
  }
};
$("btnReg").onclick = async () => {
  try {
    const r = await fetch("/api/admin/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("rName").value, email: $("rEmail").value, password: $("rPass").value, masterKey: $("rKey").value }) });
    const d = await r.json().catch(() => ({})); $("m2").style.color = r.ok ? "#16a34a" : "#dc2626"; $("m2").textContent = r.ok ? "Cadastrado com sucesso!" : (d.error || "Erro");
  } catch (e) {
    $("m2").style.color = "#dc2626"; $("m2").textContent = "Erro de comunicação com o servidor.";
  }
};
$("btnReset").onclick = async () => {
  try {
    const r = await fetch("/api/admin/reset-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("fEmail").value, masterKey: $("fKey").value, newPassword: $("fPass").value }) });
    const d = await r.json().catch(() => ({})); $("m3").style.color = r.ok ? "#16a34a" : "#dc2626"; $("m3").textContent = r.ok ? "Senha alterada!" : (d.error || "Erro");
  } catch (e) {
    $("m3").style.color = "#dc2626"; $("m3").textContent = "Erro de comunicação com o servidor.";
  }
};
$("btnOut").onclick = async () => {
  if (tk) {
    try { await fetch("/api/admin/logout", { method: "POST", headers: { "x-admin-key": tk } }); } catch (e) {}
  }
  tk = ""; $("lPass").value = ""; $("panelBox").className = "box hide"; $("authBox").className = "box";
};
</script>
</body>
</html>
